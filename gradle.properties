org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Set to true (or pass -Pgravity.llama=true) to compile the llama.cpp JNI runtime.
# Requires the NDK, CMake and a llama.cpp checkout at app/src/main/cpp/llama.cpp
# (see docs/OFFLINE_SETUP.md). Default builds ship without the native runtime and
# the app reports "Local runtime not bundled in this build".
gravity.llama=false
