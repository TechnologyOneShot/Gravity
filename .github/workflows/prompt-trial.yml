name: picture-trial
# Realistic pictures: (1) online, Gemma's picture description with the old vs new instruction, made by
# the app's Flux service; (2) on the phone, stable-diffusion.cpp with realistic SD 1.5 models + LCM on
# an Arm CPU (4 threads, like a phone's big cores): time, memory, and the picture.
on:
  push:
    branches: [prompt-trial]
jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build llama-server (llama.cpp b6000)
        run: |
          git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF > /dev/null
          cmake --build /tmp/llama-build --target llama-server -j"$(nproc)" > /dev/null
          pip install --quiet pillow
      - name: Download Gemma 3 4B
        run: curl -fL --retry 3 -o /tmp/model.gguf https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF/resolve/main/google_gemma-3-4b-it-Q4_K_M.gguf
      - name: Describe and make five pictures, old vs new instruction
        run: |
          /tmp/llama-build/bin/llama-server -m /tmp/model.gguf -c 8192 -np 1 -fa -t "$(nproc)" --port 8089 > /tmp/server.log 2>&1 &
          for i in $(seq 1 300); do curl -sf http://127.0.0.1:8089/health > /dev/null && break; sleep 1; done
          python3 .github/scripts/online-trial.py http://127.0.0.1:8089
  on-phone:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: q8-lcm4-512
            type: q8_0
            lora: lcm
            sampler: lcm
            steps: "4"
            size: "512"
            extra: ""
          - name: f16-lcm4-512
            type: f16
            lora: lcm
            sampler: lcm
            steps: "4"
            size: "512"
            extra: ""
          - name: q8-lcm4-512-fa
            type: q8_0
            lora: lcm
            sampler: lcm
            steps: "4"
            size: "512"
            extra: "--diffusion-fa"
          - name: q8-hyper2-512
            type: q8_0
            lora: hyper2
            sampler: tcd
            steps: "2"
            size: "512"
            extra: ""
          - name: q8-lcm4-384
            type: q8_0
            lora: lcm
            sampler: lcm
            steps: "4"
            size: "384"
            extra: ""
    name: on-phone (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Build stable-diffusion.cpp 52491bd for Arm
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp /tmp/sd
          git -C /tmp/sd checkout -q 52491bd && git -C /tmp/sd submodule update -q --init --recursive
          cmake -S /tmp/sd -B /tmp/sdb -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 > /tmp/cmake.log
          cmake --build /tmp/sdb -j"$(nproc)" > /tmp/build.log 2>&1 || (tail -30 /tmp/build.log; exit 1)
          pip install --quiet pillow
      - name: Download Realistic Vision 5.1, the LoRA and TAESD
        run: |
          mkdir -p /tmp/m /tmp/lora
          curl -fL --retry 3 -o /tmp/m/model.safetensors https://huggingface.co/SG161222/Realistic_Vision_V5.1_noVAE/resolve/main/Realistic_Vision_V5.1_fp16-no-ema.safetensors
          if [ "${{ matrix.lora }}" = hyper2 ]; then
            curl -fL --retry 3 -o /tmp/lora/hyper2.safetensors https://huggingface.co/ByteDance/Hyper-SD/resolve/main/Hyper-SD15-2steps-lora.safetensors
          else
            curl -fL --retry 3 -o /tmp/lora/lcm.safetensors https://huggingface.co/latent-consistency/lcm-lora-sdv1-5/resolve/main/pytorch_lora_weights.safetensors
          fi
          curl -fL --retry 3 -o /tmp/m/taesd.safetensors https://huggingface.co/madebyollin/taesd/resolve/main/diffusion_pytorch_model.safetensors
      - name: Make the monkey picture
        run: |
          set +e
          SD=$(ls /tmp/sdb/bin/sd-cli /tmp/sdb/bin/sd 2>/dev/null | head -1)
          CFG=1.5; [ "${{ matrix.lora }}" = hyper2 ] && CFG=1.0
          P="a photo of a brown monkey sitting on a tree branch in a lush green jungle, holding a banana, curious expression, full-body shot at eye level, soft golden-hour sunlight through the leaves, photorealistic, sharp focus, natural colours, detailed fur"
          echo "=====SD 1 | ${{ matrix.name }}"
          /usr/bin/time -v $SD -m /tmp/m/model.safetensors --type ${{ matrix.type }} --taesd /tmp/m/taesd.safetensors --lora-model-dir /tmp/lora \
            -p "$P <lora:${{ matrix.lora }}:1>" -n "cartoon, drawing, painting, blurry, deformed, extra limbs, text, watermark" \
            --sampling-method ${{ matrix.sampler }} --steps ${{ matrix.steps }} --cfg-scale $CFG -W ${{ matrix.size }} -H ${{ matrix.size }} -t 4 -s 42 ${{ matrix.extra }} \
            -o /tmp/out.png > /tmp/sd.log 2> /tmp/time.txt
          echo "EXIT $?"
          grep -iE "sampling completed|decode.*taken|completed, taking|error|unknown|invalid" /tmp/sd.log | tail -6
          grep -E "Elapsed|Maximum resident" /tmp/time.txt
          [ -f /tmp/out.png ] && python3 .github/scripts/thumb.py /tmp/out.png || (tail -15 /tmp/sd.log; tail -5 /tmp/time.txt)
