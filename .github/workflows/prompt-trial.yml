name: drawing-trial
# Which picture instruction makes a phone model (Gemma 3 4B) draw recognisable SVG pictures?
# Each version draws five subjects with the app's prompt and sampler; the replies are in the log.
on:
  push:
    branches: [prompt-trial]
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v1np_plan_nopenalty
            penalty: "1.0"
            temp: "0.4"
          - variant: v3_features
            penalty: "1.05"
            temp: "0.4"
          - variant: v3np_features_nopenalty
            penalty: "1.0"
            temp: "0.4"
          - variant: v3np02_features_nopenalty_temp02
            penalty: "1.0"
            temp: "0.2"
    name: draw (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
      - name: Build llama-server (llama.cpp b6000)
        run: |
          git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF > /dev/null
          cmake --build /tmp/llama-build --target llama-server -j"$(nproc)" > /dev/null
      - name: Download Gemma 3 4B
        run: curl -fL --retry 3 -o /tmp/model.gguf https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF/resolve/main/google_gemma-3-4b-it-Q4_K_M.gguf
      - name: Draw five pictures
        run: |
          /tmp/llama-build/bin/llama-server -m /tmp/model.gguf -c 8192 -np 1 -fa -t "$(nproc)" --port 8089 > /tmp/server.log 2>&1 &
          for i in $(seq 1 300); do curl -sf http://127.0.0.1:8089/health > /dev/null && break; sleep 1; done
          python3 .github/scripts/drawing-trial.py dtrial/variants/${{ matrix.variant }}.txt dtrial/questions.txt http://127.0.0.1:8089 ${{ matrix.penalty }} ${{ matrix.temp }}
