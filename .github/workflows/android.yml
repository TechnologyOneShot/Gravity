name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      llama:
        description: "Also build an APK that bundles the llama.cpp runtime"
        type: boolean
        default: false
      llama_tag:
        description: "llama.cpp git tag to build against"
        type: string
        default: "b6000"

# A newer push cancels the older run (saves Actions minutes).
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Upload App Builder prompts (for the phone-model check)
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-prompts
          path: |
            app/build/app-builder-prompts/
            app/build/app-builder-repair.json

      - name: Upload chat prompt and questions (for the phone-model chat check)
        uses: actions/upload-artifact@v4
        with:
          name: chat-prompts
          path: app/build/chat-prompts/

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verification summary
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              s = ET.parse(f).getroot()
              t, fl, e, sk = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              total += t; fail += fl; err += e; skip += sk
              print(f"{s.get('name')}: {t} tests, {fl} failures, {e} errors, {sk} skipped")
              for case in s.iter("testcase"):
                  bad = case.find("failure") is not None or case.find("error") is not None
                  print(f"  {'FAIL' if bad else 'ok  '} {case.get('name')}")
          print(f"UNIT TESTS: {total} total, {fail} failures, {err} errors, {skip} skipped")
          EOF
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in app/build/outputs/apk/debug/*.apk; do
            ls -l "$apk"
            sha256sum "$apk"
            "$BT/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|native-code)"
            "$BT/apksigner" verify --print-certs "$apk" | head -3
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gravity-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  phone-model-app-check:
    # Can real phone-sized models write a working app with App Builder's single-file prompt?
    # Runs the exact prompts (exported by a unit test) through each model with llama.cpp b6000
    # on the runner, with the app's sampler settings, then uses each app in jsdom
    # (calculator: 7 + 8 = 15; to-do: a typed task is listed; music player: file picker,
    # audio and play button). A quality report: only a run that cannot execute fails.
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Qwen2.5-Coder-1.5B-Instruct-Q4_K_M
            url: https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          - model: Qwen2.5-Coder-3B-Instruct-Q4_K_M
            url: https://huggingface.co/bartowski/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf
          - model: Qwen2.5-Coder-7B-Instruct-Q4_K_M
            url: https://huggingface.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
    name: phone-model-app-check (${{ matrix.model }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-builder-prompts
          path: prompts

      - name: Build llama-server (llama.cpp b6000)
        run: |
          git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/llama-build --target llama-server -j"$(nproc)"

      - name: Download ${{ matrix.model }}
        run: |
          curl -fL --retry 3 -o /tmp/model.gguf "${{ matrix.url }}"
          ls -l /tmp/model.gguf
          sha256sum /tmp/model.gguf

      - name: Install jsdom (for using the generated apps)
        run: npm install --prefix /tmp/smoke jsdom@24 --no-audit --no-fund

      - name: Generate and use apps
        env:
          NODE_PATH: /tmp/smoke/node_modules
        run: |
          /tmp/llama-build/bin/llama-server -m /tmp/model.gguf -c 8192 -np 1 -t "$(nproc)" --port 8089 > /tmp/server.log 2>&1 &
          for i in $(seq 1 300); do curl -sf http://127.0.0.1:8089/health > /dev/null && break; sleep 1; done
          ls -R prompts
          python3 .github/scripts/phone-model-check.py prompts/app-builder-prompts http://127.0.0.1:8089 phone-model-apps 2 prompts/app-builder-repair.json

      - name: Server log
        if: always()
        run: tail -n 40 /tmp/server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-model-apps-${{ matrix.model }}
          path: phone-model-apps/

  phone-model-chat-check:
    # How well do phone-sized models chat in Hindi / Hinglish / English with Gravity's real chat
    # prompt and sampler? Asks the questions exported by ChatPromptTest (including "what can and
    # can't you do", right after a poem) through llama.cpp b6000 on the runner and saves every
    # answer for reading. A report: only a run that cannot execute fails.
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Gemma-3-4B-it-Q4_K_M
            url: https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF/resolve/main/google_gemma-3-4b-it-Q4_K_M.gguf
          - model: Llama-3.2-3B-Instruct-Q4_K_M
            url: https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf
          - model: Qwen2.5-7B-Instruct-Q4_K_M
            url: https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
          - model: Qwen2.5-Coder-7B-Instruct-Q4_K_M
            url: https://huggingface.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
    name: phone-model-chat-check (${{ matrix.model }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chat-prompts
          path: chat-prompts

      - name: Build llama-server (llama.cpp b6000)
        run: |
          git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/llama-build --target llama-server -j"$(nproc)"

      - name: Download ${{ matrix.model }}
        run: |
          curl -fL --retry 3 -o /tmp/model.gguf "${{ matrix.url }}"
          ls -l /tmp/model.gguf
          sha256sum /tmp/model.gguf

      - name: Ask the chat questions
        run: |
          /tmp/llama-build/bin/llama-server -m /tmp/model.gguf -c 8192 -np 1 -t "$(nproc)" --port 8089 > /tmp/server.log 2>&1 &
          for i in $(seq 1 300); do curl -sf http://127.0.0.1:8089/health > /dev/null && break; sleep 1; done
          python3 .github/scripts/phone-model-chat-check.py chat-prompts http://127.0.0.1:8089 chat-answers "${{ matrix.model }}"

      - name: Server log
        if: always()
        run: tail -n 40 /tmp/server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-model-chat-${{ matrix.model }}
          path: chat-answers/

  arm64-native-check:
    # The app's inference core (gravity_core.cpp), built for arm64 phones with the same NDK, API
    # level and llama.cpp settings as the APK, run under ARM emulation (qemu) with a real small
    # instruct model and Qwen2.5-Coder-1.5B (Q4_K_M, Q4_0, Q8_0). The APK's native library is a
    # Release build (the llama job prints its CMakeCache), so the check builds Release too.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { llamafile: "OFF", build: Release, engine: standard, arch: "" }
          - { llamafile: "OFF", build: Release, engine: fast, arch: "armv8.2-a+dotprod+fp16" }
    name: arm64-native-check (${{ matrix.engine }} engine)
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK and qemu
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user file > /dev/null || sudo apt-get install -y -qq qemu-user-static file > /dev/null
          QEMU=$(command -v qemu-aarch64 || command -v qemu-aarch64-static)
          echo "QEMU=$QEMU" >> "$GITHUB_ENV"
          "$QEMU" --version | head -1

      - name: Fetch llama.cpp b6000
        run: git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp

      - name: Build gravity-cli for arm64-v8a (NDK 27, API 26, like the APK)
        run: |
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          cmake -S tools/arm-check -B /tmp/arm-build -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DLLAMA_DIR=/tmp/llama.cpp -DCHECK_LLAMAFILE=${{ matrix.llamafile }} -DGGML_CPU_ARM_ARCH="${{ matrix.arch }}" > /tmp/cmake.log
          grep -i "llamafile\|ARM" /tmp/cmake.log | head -20 || true
          cmake --build /tmp/arm-build --target gravity-cli -j"$(nproc)"
          file /tmp/arm-build/gravity-cli

      - name: Download models (the 0.5B check model and Qwen2.5-Coder-1.5B, the model a user runs)
        run: |
          curl -fsSL --retry 3 -o /tmp/q05.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          if [ "${{ matrix.llamafile }}" = "OFF" ] && [ "${{ matrix.build }}" = "Release" ]; then
            for q in q4_k_m q4_0 q8_0; do
              curl -fsSL --retry 3 -o /tmp/coder-$q.gguf https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-$q.gguf
            done
          fi
          ls -l /tmp/*.gguf

      - name: Ask on emulated ARM CPUs
        run: |
          set +e
          ok=0
          SYS="You are Gravity, a friendly and capable AI assistant in an Android app. Reply in the language and script the user writes in (Hindi, Hinglish or English). Give clear, correct, well-organised answers; keep them as short as the question allows. Use Markdown, and put code in fenced code blocks. If you are not sure, say so instead of guessing."
          ask() { # model threads ctx cpu question expect
            echo "=== $(basename $1) threads=$2 ctx=$3 cpu=$4 llamafile=${{ matrix.llamafile }}: $5"
            timeout 1500 "$QEMU" -cpu $4 /tmp/arm-build/gravity-cli "$1" "$2" "$3" "$5" "$SYS" 0.4 40 2>/tmp/stderr.txt | tee /tmp/answer.txt
            if grep -qi "^ANSWER:.*$6" /tmp/answer.txt; then echo "VERDICT: correct"; else echo "VERDICT: WRONG"; tail -3 /tmp/stderr.txt; ok=1; fi
          }
          ask /tmp/q05.gguf 4 1024 max "What is the capital of France? Answer with one word." paris
          ask /tmp/q05.gguf 4 1024 cortex-a76 "What is the capital of France? Answer with one word." paris
          if [ "${{ matrix.llamafile }}" = "OFF" ] && [ "${{ matrix.build }}" = "Release" ]; then
            for q in q4_k_m q4_0 q8_0; do
              for t in 4 8; do
                ask /tmp/coder-$q.gguf $t 4096 max "What is 12 + 30? Reply with the number only." 42
              done
            done
            ask /tmp/coder-q4_k_m.gguf 8 4096 max "hello" "hello\|hi\|help\|assist"
            ask /tmp/coder-q4_k_m.gguf 4 4096 cortex-a76 "What is the capital of France? Answer with one word." paris
            # Second turn in the same conversation: the kept context must be reused and still answer right.
            echo "=== follow-up turn (context reuse)"
            FOLLOWUP="And the capital of Germany? Answer with one word." timeout 1500 "$QEMU" -cpu max /tmp/arm-build/gravity-cli /tmp/coder-q4_k_m.gguf 4 4096 \
              "What is the capital of France? Answer with one word." "$SYS" 0.4 40 2>/tmp/stderr.txt | tee /tmp/answer.txt
            if grep -qi "^ANSWER2:.*berlin" /tmp/answer.txt && grep -qE "^REUSED: [1-9]" /tmp/answer.txt; then echo "VERDICT: correct (context reused)"; else echo "VERDICT: WRONG"; tail -3 /tmp/stderr.txt; ok=1; fi
            export NO_MMAP=1  # safe mode: the model read into memory instead of mapped
            ask /tmp/coder-q4_k_m.gguf 4 4096 max "What is 12 + 30? Reply with the number only." 42
            unset NO_MMAP
          fi
          # The app ships with llamafile OFF: that build must answer correctly.
          if [ "${{ matrix.llamafile }}" = "OFF" ]; then exit $ok; fi
          exit 0

  arm64-apk-translated:
    # The real arm64-v8a native library from the APK (AGP build, JNI, ART), run on the x86_64
    # emulator through Android's ARM translation, with a real instruct model (t12d).
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda || true

      - name: Fetch llama.cpp
        run: git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the arm64-only APK and test APK first (keeps the emulator step light)
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -Pgravity.llama=true -Pgravity.abis=arm64-v8a --stacktrace

      - name: arm64-only APK on the x86_64 emulator (ARM translation), real model
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb shell getprop ro.product.cpu.abilist; adb shell getprop ro.dalvik.vm.native.bridge
            GRAVITY_GRADLE_ARGS="-Pgravity.llama=true -Pgravity.abis=arm64-v8a -Pandroid.testInstrumentationRunnerArguments.class=com.gravity.ide.DeviceServicesTest#t12d_realInstructModelAnswersCorrectly" bash .github/scripts/emulator-tests.sh

      - name: Results
        if: always()
        run: python3 .github/scripts/emulator-report.py

  emulator-tests:
    # Installs the debug APK on an Android 14 emulator and drives the real app:
    # every screen, chat, self-test, builds, backup, credentials, downloads, offline mode.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run on-device tests (Android 14 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/emulator-tests.sh

      - name: Results
        if: always()
        run: python3 .github/scripts/emulator-report.py

      - name: Upload evidence (screenshots, logs, test XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: ci-out/

  llama-apk-and-emulator-tests:
    # Debug APK with the on-device llama.cpp runtime (arm64-v8a + x86_64). The x86_64 build is
    # installed on the emulator and the full suite runs, including loading a real GGUF model and
    # generating tokens online and in airplane mode. The APK is then attached to debug-latest.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.llama)
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda || true
          df -h /

      - name: Fetch llama.cpp
        run: git clone --depth 1 --branch "${{ inputs.llama_tag || 'b6000' }}" https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Assemble debug APK with native runtime (+ test APK)
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -Pgravity.llama=true --stacktrace

      - name: APK details
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ls -l app/build/outputs/apk/debug/app-debug.apk
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^(package|native-code)"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/" || true
          # How the native library in the APK was configured (build type and flags).
          for f in app/.cxx/*/*/arm64-v8a/CMakeCache.txt; do
            echo "== $f"; grep -E "^(CMAKE_BUILD_TYPE|CMAKE_C_FLAGS|CMAKE_C_FLAGS_DEBUG|CMAKE_C_FLAGS_RELEASE|GGML_LLAMAFILE|GGML_NATIVE|ANDROID_PLATFORM):" "$f" || true
          done

      - name: Publish to the "debug-latest" pre-release (one APK, with on-device AI)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gravity-debug.apk
          cp gravity-debug.apk gravity-debug-llama.apk   # old link name keeps working
          SUM=$(sha256sum gravity-debug.apk | cut -d' ' -f1)
          git tag -f debug-latest "$GITHUB_SHA"
          git push -f origin refs/tags/debug-latest
          NOTES="Gravity debug build ${GITHUB_RUN_NUMBER} (version 0.1.${GITHUB_RUN_NUMBER}) from commit ${GITHUB_SHA::7} on main. Replaced by CI on every push.
          - gravity-debug.apk: the app, including the on-device AI engine (llama.cpp) for arm64 phones and x86_64 emulators. SHA-256 $SUM
          - gravity-debug-llama.apk: the same file under its old name.
          Debug-signed with the fixed debug key, so it installs over any build since 2026-11-23 15:30 IST; older builds must be uninstalled once. For testing, not a release build."
          gh release view debug-latest > /dev/null 2>&1 || gh release create debug-latest --prerelease --verify-tag --title "Gravity debug build (latest main)" --notes "$NOTES"
          gh release upload debug-latest gravity-debug.apk gravity-debug-llama.apk --clobber
          gh release edit debug-latest --prerelease --notes "$NOTES"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on-device tests with the native runtime (Android 14 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: GRAVITY_GRADLE_ARGS=-Pgravity.llama=true bash .github/scripts/emulator-tests.sh

      - name: Results
        if: always()
        run: python3 .github/scripts/emulator-report.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence-llama
          path: ci-out/
