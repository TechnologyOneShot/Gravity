name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      llama:
        description: "Also build an APK that bundles the llama.cpp runtime"
        type: boolean
        default: false
      llama_tag:
        description: "llama.cpp git tag to build against"
        type: string
        default: "b6000"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gravity-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  debug-apk-with-llama:
    if: github.event_name == 'workflow_dispatch' && inputs.llama
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch llama.cpp
        run: git clone --depth 1 --branch "${{ inputs.llama_tag }}" https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Assemble debug APK with native runtime
        run: ./gradlew --no-daemon assembleDebug -Pgravity.llama=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gravity-debug-apk-llama
          path: app/build/outputs/apk/debug/*.apk
